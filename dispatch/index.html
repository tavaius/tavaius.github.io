<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dispatch Functions</title>
    <!-- Set the theme before first paint so dark mode doesn't flash white on load -->
    <script>
        try { document.documentElement.dataset.theme = localStorage.getItem('aa-theme') || 'light'; } catch (_) { }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="title">Dispatch Functions</div>
        <div class="theme-switch" role="group" aria-label="Colour theme">
            <button type="button" class="theme-btn active" data-pick-theme="light" aria-pressed="true">Light</button>
            <button type="button" class="theme-btn" data-pick-theme="dark" aria-pressed="false">Dark</button>
        </div>
    </header>

    <main class="dispatch-layout">
        <aside class="desk-card desk-card-left" aria-label="Western dispatch desks">
            <div class="desk-caption">WEST DESKS</div>
            <table class="desk-table">
                <tbody>
                    <tr><th scope="row">DARTFORD</th><td></td></tr>
                    <tr><th scope="row">MEDWAY</th><td><span class="desk-tag">DSA</span></td></tr>
                    <tr><th scope="row">PADDOCK</th><td><span class="desk-tag">MB</span></td></tr>
                </tbody>
            </table>
        </aside>

        <div class="tool-content">
        <section class="panel">
            <!-- The reels. Calls go 0-99, CSP is 1-4 (min/max live on each reel, app.js reads them from here) -->
            <div class="reels">
                <div class="reel" data-reel="c2" data-min="0" data-max="99" data-value="0">
                    <span class="reel-label" id="lbl-c2">C2 Calls</span>
                    <button type="button" class="reel-btn" data-step="1" tabindex="-1" aria-label="Increase C2 Calls">
                        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5 10 6.5l6 6" /></svg>
                    </button>
                    <div class="reel-window" role="spinbutton" tabindex="0" aria-labelledby="lbl-c2" aria-valuemin="0" aria-valuemax="99" aria-valuenow="0">
                        <span class="reel-num" aria-hidden="true">0</span>
                    </div>
                    <button type="button" class="reel-btn" data-step="-1" tabindex="-1" aria-label="Decrease C2 Calls">
                        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5 10 13.5l6-6" /></svg>
                    </button>
                </div>

                <div class="reel" data-reel="c3" data-min="0" data-max="99" data-value="0">
                    <span class="reel-label" id="lbl-c3">C3 Calls</span>
                    <button type="button" class="reel-btn" data-step="1" tabindex="-1" aria-label="Increase C3 Calls">
                        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5 10 6.5l6 6" /></svg>
                    </button>
                    <div class="reel-window" role="spinbutton" tabindex="0" aria-labelledby="lbl-c3" aria-valuemin="0" aria-valuemax="99" aria-valuenow="0">
                        <span class="reel-num" aria-hidden="true">0</span>
                    </div>
                    <button type="button" class="reel-btn" data-step="-1" tabindex="-1" aria-label="Decrease C3 Calls">
                        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5 10 13.5l6-6" /></svg>
                    </button>
                </div>

                <div class="reel" data-reel="urg" data-min="0" data-max="99" data-value="0">
                    <span class="reel-label" id="lbl-urg">URG Calls</span>
                    <button type="button" class="reel-btn" data-step="1" tabindex="-1" aria-label="Increase URG Calls">
                        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5 10 6.5l6 6" /></svg>
                    </button>
                    <div class="reel-window" role="spinbutton" tabindex="0" aria-labelledby="lbl-urg" aria-valuemin="0" aria-valuemax="99" aria-valuenow="0">
                        <span class="reel-num" aria-hidden="true">0</span>
                    </div>
                    <button type="button" class="reel-btn" data-step="-1" tabindex="-1" aria-label="Decrease URG Calls">
                        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5 10 13.5l6-6" /></svg>
                    </button>
                </div>

                <!-- CSP is a level, not a call count, hence the divider (see .reel-csp) -->
                <div class="reel reel-csp" data-reel="csp" data-min="1" data-max="4" data-value="1">
                    <span class="reel-label" id="lbl-csp">CSP Level</span>
                    <button type="button" class="reel-btn" data-step="1" tabindex="-1" aria-label="Increase CSP Level">
                        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5 10 6.5l6 6" /></svg>
                    </button>
                    <div class="reel-window" role="spinbutton" tabindex="0" aria-labelledby="lbl-csp" aria-valuemin="1" aria-valuemax="4" aria-valuenow="1">
                        <span class="reel-num" aria-hidden="true">1</span>
                    </div>
                    <button type="button" class="reel-btn" data-step="-1" tabindex="-1" aria-label="Decrease CSP Level">
                        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5 10 13.5l6-6" /></svg>
                    </button>
                </div>
            </div>

            <!-- ODA combobox. Hand-rolled instead of a native <select> because the
                 native dropdown list ignores the theme. Add/remove ODAs by editing the <li>s. -->
            <div class="field">
                <span class="field-label" id="lbl-oda">ODA</span>
                <div class="combo" id="oda-combo">
                    <button type="button" class="combo-trigger" id="oda-trigger" role="combobox"
                            aria-haspopup="listbox" aria-expanded="false" aria-controls="oda-list" aria-labelledby="lbl-oda oda-trigger">
                        <span class="combo-value" id="oda-value">Select ODA</span>
                        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5 10 13.5l6-6" /></svg>
                    </button>
                    <ul class="combo-list" id="oda-list" role="listbox" aria-labelledby="lbl-oda" hidden>
                        <li class="combo-option" role="option" id="oda-opt-0">Dartford</li>
                        <li class="combo-option" role="option" id="oda-opt-1">Medway</li>
                        <li class="combo-option" role="option" id="oda-opt-2">Paddock Wood</li>
                        <li class="combo-option" role="option" id="oda-opt-3">Thanet</li>
                        <li class="combo-option" role="option" id="oda-opt-4">Ashford</li>
                        <li class="combo-option" role="option" id="oda-opt-5">South</li>
                    </ul>
                </div>
            </div>
        </section>

        <section class="panel">
            <textarea id="note" class="note" readonly aria-label="Generated note" rows="9"></textarea>
            <div class="note-actions">
                <button type="button" id="note-copy" class="confirm-btn">Copy note</button>
            </div>
        </section>
        </div>

        <aside class="desk-card desk-card-right" aria-label="Eastern dispatch desks">
            <div class="desk-caption">EAST DESKS</div>
            <table class="desk-table">
                <tbody>
                    <tr><th scope="row">THANET</th><td></td></tr>
                    <tr><th scope="row">ASHFORD</th><td><span class="desk-tag">DSA</span></td></tr>
                    <tr><th scope="row">SOUTH</th><td><span class="desk-tag">MB</span></td></tr>
                </tbody>
            </table>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
